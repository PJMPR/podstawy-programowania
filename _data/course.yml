# Course requirements
requirements: "Brak wymagań wstępnych. Kurs jest przeznaczony dla osób bez doświadczenia w programowaniu."

# Course objectives
objectives: "Nauka programowania w C# od podstaw. Zrozumienie fundamentalnych koncepcji takich jak zmienne, typy danych, instrukcje warunkowe, pętle i funkcje. Stopniowe tworzenie konsolu gry typu roguelike w trakcie semestru."

# Assessment
assessment: "Dwie niezależne oceny: egzamin końcowy z wykładu oraz zaliczenie części laboratoryjnej."

# Tools
tools: "Visual Studio Community, Visual Studio Code, JetBrains Rider, .NET SDK"

# Important note
note: "Przedmiot nie obejmuje Programowania Obiektowego (OOP), które będzie wprowadzane w kolejnym semestrze."
