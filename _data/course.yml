# Course details
course_name: "Podstawy programowania"
semester: "1"
language: "C#"
level: "Początkujący"
credits: 5

# Course requirements
requirements: "Brak wymagań wstępnych. Kurs jest przeznaczony dla osób bez doświadczenia w programowaniu."

# Course objectives
objectives: "Nauka programowania w C# od podstaw. Zrozumienie fundamentalnych koncepcji takich jak zmienne, typy danych, instrukcje warunkowe, pętle, kolekcje, metody oraz podstawy klas i obiektów. Stopniowe tworzenie konsolowej gry typu roguelike w trakcie semestru."

# Assessment
assessment: "Dwie niezależne oceny: egzamin końcowy z wykładu oraz zaliczenie części laboratoryjnej."

# Tools
tools: "Visual Studio Community, Visual Studio Code, JetBrains Rider, .NET SDK"

# Important note
note: "Przedmiot obejmuje jedynie praktyczne podstawy klas i obiektów, bez dziedziczenia, interfejsów i polimorfizmu. Pełne Programowanie Obiektowe (OOP) będzie wprowadzane w kolejnym semestrze."
