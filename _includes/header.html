<header class="site-header">
    <div class="header-container">
        <a href="{{ '/' | relative_url }}" class="logo-link" aria-label="{{ site.title }} — strona główna">
            <svg class="logo-icon" aria-hidden="true" viewBox="0 0 72 72">
                <path d="M36 4 64 20v32L36 68 8 52V20Z"/>
                <path d="m23 44 13-25 13 25-13-7Z"/>
                <circle cx="36" cy="36" r="3"/>
            </svg>
            <span class="logo-copy"><strong>{{ site.title }}</strong><small>Akademia systemów • C#</small></span>
        </a>

        <nav class="site-nav" aria-label="Główna nawigacja">
            <ul class="nav-list">
                <li><a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}"><span>01</span> Start</a></li>
                <li><a href="{{ '/plan/' | relative_url }}" class="nav-link {% if page.url == '/plan/' %}active{% endif %}"><span>02</span> Plan misji</a></li>
                <li><a href="{{ '/organizacja/' | relative_url }}" class="nav-link {% if page.url == '/organizacja/' %}active{% endif %}"><span>03</span> Procedury</a></li>
            </ul>
        </nav>

        <div class="header-info">
            <span class="status-dot" aria-hidden="true"></span>
            <span><small>Status misji</small>Tydzień {{ site.data.course.current_week }}/15</span>
        </div>
    </div>
</header>
