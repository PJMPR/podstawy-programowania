<header class="site-header">
    <div class="header-container">
        <div class="header-logo">
            <a href="{{ '/' | relative_url }}" class="logo-link">
                <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
                    <rect fill="#1a1a2e" width="64" height="64"/>
                    <rect x="8" y="8" width="48" height="48" fill="none" stroke="#e60012" stroke-width="2"/>
                    <circle cx="32" cy="32" r="6" fill="#e60012"/>
                    <rect x="14" y="20" width="4" height="24" fill="#e60012"/>
                    <rect x="46" y="20" width="4" height="24" fill="#e60012"/>
                    <rect x="20" y="14" width="24" height="4" fill="#e60012"/>
                </svg>
                <span class="logo-text">{{ site.title }}</span>
            </a>
        </div>
        
        <nav class="site-nav">
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Strona główna</a>
                </li>
                <li class="nav-item">
                    <a href="{{ '/plan/' | relative_url }}" class="nav-link {% if page.url == '/plan/' %}active{% endif %}">Plan kursu</a>
                </li>
                <li class="nav-item">
                    <a href="{{ '/organizacja/' | relative_url }}" class="nav-link {% if page.url == '/organizacja/' %}active{% endif %}">Organizacja</a>
                </li>
            </ul>
        </nav>
        
        <div class="header-info">
            <span class="current-week">Tydzień {{ site.data.course.current_week }}/15</span>
        </div>
    </div>
</header>
