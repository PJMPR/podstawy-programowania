---
layout: default
---

<div class="page-container">
    <div class="page-content">
        <h1 class="page-title">{{ page.title }}</h1>
        {% if page.description %}
            <p class="page-description">{{ page.description }}</p>
        {% endif %}
        
        <article class="page-article">
            {{ content }}
        </article>
    </div>
</div>
