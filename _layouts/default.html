<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} • {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect rx='12' fill='%23060b14' width='64' height='64'/><path d='M32 7 56 21v22L32 57 8 43V21Z' fill='none' stroke='%2355e6dc' stroke-width='3'/><path d='m21 40 11-21 11 21-11-6Z' fill='%23ffbd66'/></svg>">
</head>
<body class="site-body">
    <a class="skip-link" href="#main-content">Przejdź do treści</a>
    <div class="ambient-grid" aria-hidden="true"></div>
    {% include header.html %}
    
    <main class="site-main" id="main-content">
        {{ content }}
    </main>
    
    {% include footer.html %}
</body>
</html>
